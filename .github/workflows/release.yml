name: Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extrai versão
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
            echo "IS_RELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "VERSION=dev" >> $GITHUB_OUTPUT
            echo "IS_RELEASE=false" >> $GITHUB_OUTPUT
          fi

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configura QEMU (emulação arm64)
        uses: docker/setup-qemu-action@v3

      - name: Configura Docker Buildx (multi-arch)
        uses: docker/setup-buildx-action@v3

      - name: Build e Push (master → latest)
        if: steps.version.outputs.IS_RELEASE == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.VERSION }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e Push (tag → versão + latest)
        if: steps.version.outputs.IS_RELEASE == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verifica manifesto arm64
        run: |
          echo "=== Inspecionando manifesto ==="
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          echo "=== Verificando presença de arm64 ==="
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            | grep -q "linux/arm64" && echo "✓ arm64 presente no manifesto" \
            || (echo "✗ arm64 AUSENTE — build falhou para arm64" && exit 1)

      - name: Cria GitHub Release
        if: steps.version.outputs.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v1
        with:
          name: "v${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
          body: |
            ## Instalação

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/master/scripts/install.sh | bash
            ```

            ## Atualização

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/master/scripts/update.sh | sudo bash -s ${{ github.ref_name }}
            ```

            ## Imagem Docker

            ```
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
            ```
