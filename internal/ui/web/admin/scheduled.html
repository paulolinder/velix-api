<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velix API — Mensagens Agendadas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
  <script src="/admin/shared.js"></script>
  <style>
    [x-cloak]{display:none!important}
    .nav-item { display:flex; align-items:center; gap:0.75rem; padding:0.5rem 0.75rem; border-radius:0.5rem; font-size:0.875rem; font-weight:500; color:#9ca3af; transition:all 150ms; }
    .nav-item:hover { color:#fff; background:#1f2937; }
    .nav-item.active { color:#fff; background:#1f2937; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100" x-data="page()" x-init="init()" x-cloak>
<div class="flex h-screen overflow-hidden">

  <!-- Sidebar -->
  <aside class="w-60 bg-gray-900 border-r border-gray-800 flex flex-col flex-shrink-0">
    <div class="p-5 border-b border-gray-800">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-green-500 rounded-xl flex items-center justify-center text-xl">W</div>
        <span class="font-bold text-white">Velix API</span>
      </div>
    </div>
    <nav class="flex-1 p-3 space-y-0.5">
      <a href="/admin/dashboard.html" class="nav-item">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        Painel
      </a>
      <a href="/admin/instances.html" class="nav-item">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
        Instâncias
      </a>
      <a href="/admin/messages.html" class="nav-item">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
        Mensagens
      </a>
      <a href="/admin/scheduled.html" class="nav-item active">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        Agendamentos
      </a>
      <a href="/admin/usage.html" class="nav-item">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        Uso
      </a>
      <a href="/docs" target="_blank" class="nav-item">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        Docs da API
      </a>
    </nav>
    <div class="p-4 border-t border-gray-800">
      <p class="text-xs text-gray-500 truncate mb-2" x-text="email"></p>
      <button @click="doLogout()" class="w-full text-left text-xs text-gray-500 hover:text-red-400 transition flex items-center gap-2">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        Sair
      </button>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 overflow-auto">
    <div class="p-8">
      <div class="mb-8">
        <h1 class="text-2xl font-bold text-white">Mensagens Agendadas</h1>
        <p class="text-gray-500 text-sm mt-1">Visualize e cancele mensagens agendadas pendentes</p>
      </div>

      <!-- Controls -->
      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 mb-6 flex flex-wrap gap-4 items-end">
        <div>
          <label class="block text-xs text-gray-500 mb-1.5 uppercase tracking-wider">Instância</label>
          <select x-model="instanceID" @change="currentPage=0; loadScheduled()"
                  class="bg-gray-800 border border-gray-700 text-gray-100 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-green-500">
            <option value="">Selecione a instância…</option>
            <template x-for="inst in instances" :key="inst.id">
              <option :value="inst.id" x-text="inst.name"></option>
            </template>
          </select>
        </div>
        <button @click="loadScheduled()" :disabled="!instanceID"
                class="bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300 px-4 py-2 rounded-lg text-sm font-medium transition disabled:opacity-40">
          Atualizar
        </button>

        <!-- Summary pills -->
        <template x-if="messages.length > 0">
          <div class="flex gap-2 ml-auto">
            <span class="bg-yellow-500/10 text-yellow-400 border border-yellow-500/20 px-3 py-1 rounded-full text-xs font-medium"
                  x-text="`${messages.filter(m=>m.status==='scheduled').length} pendentes`"></span>
            <span class="bg-gray-500/10 text-gray-400 border border-gray-500/20 px-3 py-1 rounded-full text-xs font-medium"
                  x-text="`${messages.filter(m=>m.status==='cancelled').length} canceladas`"></span>
          </div>
        </template>
      </div>

      <!-- Table -->
      <div class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden">
        <table class="w-full text-sm">
          <thead class="border-b border-gray-800">
            <tr>
              <th class="px-5 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
              <th class="px-5 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
              <th class="px-5 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Para</th>
              <th class="px-5 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Tipo</th>
              <th class="px-5 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Prévia</th>
              <th class="px-5 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Agendado para</th>
              <th class="px-5 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Ação</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-800">
            <template x-if="loading">
              <tr><td colspan="7" class="px-5 py-10 text-center text-gray-500">Carregando…</td></tr>
            </template>
            <template x-if="!loading && !instanceID">
              <tr><td colspan="7" class="px-5 py-10 text-center text-gray-500">Selecione uma instância para ver mensagens agendadas.</td></tr>
            </template>
            <template x-if="!loading && instanceID && messages.length === 0">
              <tr><td colspan="7" class="px-5 py-10 text-center text-gray-500">Nenhuma mensagem agendada para esta instância.</td></tr>
            </template>
            <template x-for="m in messages" :key="m.id">
              <tr class="hover:bg-gray-800/50 transition">
                <td class="px-5 py-3 font-mono text-xs text-gray-500" x-text="m.id.slice(0,8)+'…'"></td>
                <td class="px-5 py-3">
                  <span :class="m.status==='scheduled'
                        ? 'bg-yellow-500/10 text-yellow-400 border border-yellow-500/20'
                        : 'bg-gray-500/10 text-gray-400 border border-gray-500/20'"
                        class="px-2 py-0.5 rounded-full text-xs font-medium" x-text="m.status"></span>
                </td>
                <td class="px-5 py-3 font-mono text-xs text-gray-400" x-text="m.to_jid"></td>
                <td class="px-5 py-3 text-xs text-gray-400" x-text="m.type"></td>
                <td class="px-5 py-3 text-xs text-gray-300 max-w-xs truncate"
                    x-text="m.content?.text || m.content?.caption || `[${m.type}]`"></td>
                <td class="px-5 py-3 text-xs text-gray-500" x-text="fmtDate(m.scheduled_at)"></td>
                <td class="px-5 py-3">
                  <button x-show="m.status==='scheduled'"
                          @click="cancelMsg(m.id)"
                          class="text-xs text-red-400 hover:text-red-300 font-medium transition">
                    Cancelar
                  </button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>

        <!-- Pagination -->
        <div class="px-5 py-3 border-t border-gray-800 flex items-center justify-between text-sm text-gray-400">
          <button @click="prevPage()" :disabled="currentPage===0"
                  class="px-3 py-1 rounded-lg border border-gray-700 hover:bg-gray-800 disabled:opacity-30 transition">← Anterior</button>
          <span class="text-xs">Página <span x-text="currentPage+1"></span></span>
          <button @click="nextPage()" :disabled="messages.length < pageSize"
                  class="px-3 py-1 rounded-lg border border-gray-700 hover:bg-gray-800 disabled:opacity-30 transition">Próximo →</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
function page() {
  return {
    instances: [],
    messages: [],
    loading: false,
    instanceID: '',
    currentPage: 0,
    pageSize: 50,
    email: '',

    async init() {
      requireAuth();
      this.email = getUserEmail();
      const res = await apiCall('GET', '/instances?limit=200');
      this.instances = Array.isArray(res) ? res : (res?.instances || []);
    },

    async loadScheduled() {
      if (!this.instanceID) return;
      this.loading = true;
      const q = new URLSearchParams({ limit: this.pageSize, offset: this.currentPage * this.pageSize });
      const res = await apiCall('GET', `/instances/${this.instanceID}/messages/scheduled?${q}`);
      this.messages = Array.isArray(res) ? res : [];
      this.loading = false;
    },

    async cancelMsg(msgID) {
      if (!confirm('Cancelar esta mensagem agendada? Isso não pode ser desfeito.')) return;
      await apiCall('DELETE', `/instances/${this.instanceID}/messages/${msgID}/schedule`);
      await this.loadScheduled();
    },

    prevPage() { if (this.currentPage > 0) { this.currentPage--; this.loadScheduled(); } },
    nextPage() { this.currentPage++; this.loadScheduled(); },
  };
}
</script>
</body>
</html>
