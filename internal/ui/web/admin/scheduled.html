<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/admin/dist/favicon.svg">
  <title>Velix API — Agendamentos</title>
  <link rel="stylesheet" href="/admin/dist/main.css">
  <script defer src="/admin/dist/alpine.min.js"></script>
  <script src="/admin/shared.js"></script>
</head>
<body class="bg-[#0d1117] text-gray-100" x-data="page()" x-init="init()" x-cloak>
<div class="flex h-screen overflow-hidden">

  <!-- Sidebar -->
  <aside class="w-56 bg-[#0d1117] border-r border-[#1f2937] flex flex-col flex-shrink-0">
    <div class="px-4 py-5 border-b border-[#1f2937]">
      <div class="flex items-center gap-2.5">
        <img src="/admin/dist/velix-logo.svg" alt="Velix" class="w-8 h-8 rounded-lg shadow-lg shadow-green-900/50">
        <div>
          <p class="font-semibold text-white text-sm leading-tight">Velix API</p>
          <p class="text-[10px] text-gray-500">Admin</p>
        </div>
      </div>
    </div>
    <nav class="flex-1 p-2.5 space-y-0.5">
      <a href="/admin/dashboard.html" class="nav-item">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Painel
      </a>
      <a href="/admin/instances.html" class="nav-item">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
        Instâncias
      </a>
      <a href="/admin/messages.html" class="nav-item">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
        Mensagens
      </a>
      <a href="/admin/scheduled.html" class="nav-item active">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        Agendamentos
      </a>
      <a href="/admin/usage.html" class="nav-item">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        Uso
      </a>
      <a href="/admin/users.html" x-show="isAdmin()" class="nav-item">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6-1.13a4 4 0 100-8 4 4 0 000 8zm6 3.13a4 4 0 010 7.75"/></svg>
        Usuários
      </a>
      <div class="border-t border-[#1f2937] my-2"></div>
      <a href="/admin/guide.html" class="nav-item">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        Guia de Uso
      </a>
      <a href="/docs" target="_blank" class="nav-item">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        Docs da API
        <svg class="w-3 h-3 ml-auto opacity-40" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
      </a>
    </nav>
    <div class="p-3 border-t border-[#1f2937]">
      <div class="flex items-center gap-2.5 px-2 py-2 rounded-lg">
        <div class="w-7 h-7 rounded-full bg-gradient-to-br from-green-500 to-emerald-700 flex items-center justify-center text-xs font-bold text-white flex-shrink-0" x-text="getEmailInitial()"></div>
        <p class="text-xs text-gray-400 truncate flex-1" x-text="email"></p>
        <button @click="doLogout()" class="text-gray-600 hover:text-red-400 transition" title="Sair">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 overflow-auto">
    <div class="max-w-6xl mx-auto p-6">

      <!-- Header -->
      <div class="mb-7">
        <h1 class="text-xl font-semibold text-white">Mensagens Agendadas</h1>
        <p class="text-gray-500 text-sm mt-0.5">Visualize e cancele mensagens pendentes</p>
      </div>

      <!-- Controls -->
      <div class="bg-[#161b22] border border-[#1f2937] rounded-2xl p-4 mb-5">
        <div class="flex flex-wrap gap-3 items-end">
          <div class="flex-1 min-w-[200px]">
            <label class="block text-xs text-gray-500 mb-1.5 font-medium">Instância</label>
            <select x-model="instanceID" @change="currentPage=0; loadScheduled()" class="field w-full">
              <option value="">Selecione…</option>
              <template x-for="inst in instances" :key="inst.id">
                <option :value="inst.id" x-text="inst.name"></option>
              </template>
            </select>
          </div>
          <button @click="loadScheduled()" :disabled="!instanceID"
                  class="btn btn-secondary">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            Atualizar
          </button>

          <!-- Summary pills -->
          <template x-if="messages.length > 0">
            <div class="flex gap-2 ml-auto">
              <span class="bg-yellow-500/10 text-yellow-400 border border-yellow-500/20 px-3 py-1 rounded-full text-xs font-medium"
                    x-text="pendingCount() + ' pendentes'"></span>
              <span class="bg-gray-700/50 text-gray-400 border border-gray-700/50 px-3 py-1 rounded-full text-xs font-medium"
                    x-text="cancelledCount() + ' canceladas'"></span>
            </div>
          </template>
        </div>
      </div>

      <!-- Table -->
      <div class="bg-[#161b22] border border-[#1f2937] rounded-2xl overflow-hidden">
        <table class="w-full text-sm">
          <thead class="border-b border-[#1f2937]">
            <tr>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Para</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Tipo</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Prévia</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Agendado para</th>
              <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Ação</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-[#1f2937]">

            <!-- Loading -->
            <template x-if="loading">
              <tr>
                <td colspan="7" class="px-4 py-10 text-center">
                  <div class="flex items-center justify-center gap-2 text-gray-500 text-sm">
                    <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                    Carregando…
                  </div>
                </td>
              </tr>
            </template>

            <!-- Prompt -->
            <template x-if="!loading && !instanceID">
              <tr>
                <td colspan="7" class="px-4 py-14 text-center">
                  <div class="flex flex-col items-center gap-2">
                    <svg class="w-8 h-8 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    <p class="text-gray-500 text-sm">Selecione uma instância para ver mensagens agendadas</p>
                  </div>
                </td>
              </tr>
            </template>

            <!-- Empty -->
            <template x-if="!loading && instanceID && messages.length === 0">
              <tr>
                <td colspan="7" class="px-4 py-10 text-center text-gray-500 text-sm">Nenhuma mensagem agendada para esta instância.</td>
              </tr>
            </template>

            <!-- Rows -->
            <template x-for="m in messages" :key="m.id">
              <tr class="hover:bg-white/[.02] transition">
                <td class="px-4 py-3 font-mono text-xs text-gray-600" x-text="m.id.slice(0,8)+'…'"></td>
                <td class="px-4 py-3">
                  <span :class="m.status==='scheduled'
                        ? 'bg-yellow-500/10 text-yellow-400 border border-yellow-500/20'
                        : 'bg-gray-700/50 text-gray-500 border border-gray-700/50'"
                        class="px-1.5 py-0.5 rounded-full text-xs font-medium" x-text="m.status"></span>
                </td>
                <td class="px-4 py-3 font-mono text-xs text-gray-400 max-w-[160px] truncate" x-text="m.to_jid"></td>
                <td class="px-4 py-3 text-xs text-gray-400" x-text="m.type"></td>
                <td class="px-4 py-3 text-xs text-gray-300 max-w-[200px] truncate"
                    x-text="m.content?.text || m.content?.caption || `[${m.type}]`"></td>
                <td class="px-4 py-3 text-xs text-gray-500 whitespace-nowrap" x-text="fmtDate(m.scheduled_at)"></td>
                <td class="px-4 py-3 text-right">
                  <button x-show="m.status==='scheduled'"
                          @click="cancelMsg(m.id)"
                          class="text-xs text-red-500 hover:text-red-400 font-medium transition px-2 py-1 rounded-lg hover:bg-red-950/40">
                    Cancelar
                  </button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>

        <!-- Pagination -->
        <div class="px-5 py-3 border-t border-[#1f2937] flex items-center justify-between">
          <button @click="prevPage()" :disabled="currentPage===0"
                  class="btn btn-secondary text-xs px-3 py-1.5">← Anterior</button>
          <span class="text-xs text-gray-500">Página <span class="text-gray-300" x-text="currentPage+1"></span></span>
          <button @click="nextPage()" :disabled="messages.length < pageSize"
                  class="btn btn-secondary text-xs px-3 py-1.5">Próximo →</button>
        </div>
      </div>

    </div>
  </main>
</div>

<script>
function page() {
  return {
    instances: [],
    messages: [],
    loading: false,
    instanceID: '',
    currentPage: 0,
    pageSize: 50,
    email: '',

    pendingCount() { return this.messages.filter(function(m){ return m.status === 'scheduled'; }).length; },
    cancelledCount() { return this.messages.filter(function(m){ return m.status === 'cancelled'; }).length; },

    async init() {
      requireAuth();
      this.email = getUserEmail();
      const res = await apiCall('GET', '/instances?limit=200');
      this.instances = Array.isArray(res) ? res : (res?.instances || []);
    },

    async loadScheduled() {
      if (!this.instanceID) return;
      this.loading = true;
      const q = new URLSearchParams({ limit: this.pageSize, offset: this.currentPage * this.pageSize });
      const res = await apiCall('GET', `/instances/${this.instanceID}/messages/scheduled?${q}`);
      this.messages = Array.isArray(res) ? res : [];
      this.loading = false;
    },

    async cancelMsg(msgID) {
      if (!confirm('Cancelar esta mensagem agendada? Esta ação não pode ser desfeita.')) return;
      await apiCall('DELETE', `/instances/${this.instanceID}/messages/${msgID}/schedule`);
      await this.loadScheduled();
    },

    prevPage() { if (this.currentPage > 0) { this.currentPage--; this.loadScheduled(); } },
    nextPage() { this.currentPage++; this.loadScheduled(); },
  };
}
</script>
</body>
</html>
