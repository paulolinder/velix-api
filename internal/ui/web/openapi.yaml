openapi: 3.0.3
info:
  title: Velix API
  description: |
    API WhatsApp multi-instância. Gerencie instâncias, envie mensagens (texto, mídia, reações),
    receba eventos em tempo real via webhooks ou WebSocket e agende mensagens.
  version: "1.4.0"
  contact:
    name: Velix Support
  x-logo:
    url: /admin/dist/velix-logo.svg
    altText: Velix

servers:
  - url: /v1
    description: Current server

security:
  - bearerAuth: []
  - apiKeyHeader: []

tags:
  - name: Auth
    description: Registration, login, API key management
  - name: Instances
    description: WhatsApp instance lifecycle and settings
  - name: Messages
    description: Send, schedule, and query messages
  - name: Contacts
    description: Contact management
  - name: Groups
    description: Group management
  - name: Webhooks
    description: Webhook endpoint registration
  - name: Events
    description: Real-time event streaming

paths:
  # ─── Auth ───────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new workspace
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current workspace info
      responses:
        '200':
          description: OK

  /auth/api-keys:
    get:
      tags: [Auth]
      summary: List API keys
      responses:
        '200':
          description: OK
    post:
      tags: [Auth]
      summary: Create a new API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Created

  /auth/api-keys/{keyID}:
    delete:
      tags: [Auth]
      summary: Revoke an API key
      parameters:
        - $ref: '#/components/parameters/keyID'
      responses:
        '204':
          description: Revoked

  # ─── Instances ──────────────────────────────────────────────────────────────
  /instances:
    get:
      tags: [Instances]
      summary: List all instances in your workspace
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Instance'
    post:
      tags: [Instances]
      summary: Create a new WhatsApp instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstanceRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'

  /instances/{instanceID}:
    get:
      tags: [Instances]
      summary: Get instance details
      parameters:
        - $ref: '#/components/parameters/instanceID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
    delete:
      tags: [Instances]
      summary: Delete an instance
      parameters:
        - $ref: '#/components/parameters/instanceID'
      responses:
        '204':
          description: Deleted

  /instances/{instanceID}/status:
    get:
      tags: [Instances]
      summary: Get real-time connection status of an instance
      parameters:
        - $ref: '#/components/parameters/instanceID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [disconnected, connecting, connected, logged_out, banned]

  /instances/{instanceID}/connect:
    post:
      tags: [Instances]
      summary: Connect an instance to WhatsApp
      parameters:
        - $ref: '#/components/parameters/instanceID'
      responses:
        '200':
          description: OK

  /instances/{instanceID}/disconnect:
    post:
      tags: [Instances]
      summary: Disconnect an instance (keeps session)
      parameters:
        - $ref: '#/components/parameters/instanceID'
      responses:
        '200':
          description: OK

  /instances/{instanceID}/logout:
    post:
      tags: [Instances]
      summary: Log out and clear the WhatsApp session
      parameters:
        - $ref: '#/components/parameters/instanceID'
      responses:
        '200':
          description: OK

  /instances/{instanceID}/qr:
    get:
      tags: [Instances]
      summary: Stream QR code for WhatsApp Web pairing (SSE)
      parameters:
        - $ref: '#/components/parameters/instanceID'
      responses:
        '200':
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: string

  /instances/{instanceID}/pair-code:
    post:
      tags: [Instances]
      summary: Request a numeric pairing code (alternative to QR)
      parameters:
        - $ref: '#/components/parameters/instanceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  description: Phone number with country code (e.g. 5511999999999)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string

  /instances/{instanceID}/settings:
    get:
      tags: [Instances]
      summary: Get instance settings
      parameters:
        - $ref: '#/components/parameters/instanceID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceSettings'
    patch:
      tags: [Instances]
      summary: Update instance settings
      parameters:
        - $ref: '#/components/parameters/instanceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceSettings'
      responses:
        '200':
          description: OK

  /instances/{instanceID}/presence:
    post:
      tags: [Instances]
      summary: Send a presence/typing indicator
      description: |
        Send `available` or `unavailable` as a global presence update.
        Send `typing`, `recording`, or `paused` with a `to` JID to indicate activity in a specific chat.
      parameters:
        - $ref: '#/components/parameters/instanceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                to:
                  type: string
                  description: JID of the chat (required for typing/recording/paused)
                type:
                  type: string
                  enum: [typing, recording, paused, available, unavailable]
      responses:
        '200':
          description: OK

  /instances/{instanceID}/profile:
    patch:
      tags: [Instances]
      summary: Update display name and/or profile photo
      parameters:
        - $ref: '#/components/parameters/instanceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                photo_b64:
                  type: string
                  format: byte
                  description: Base64-encoded image bytes
      responses:
        '200':
          description: OK

  /instances/{instanceID}/status-message:
    patch:
      tags: [Instances]
      summary: Update the instance's "About" text
      parameters:
        - $ref: '#/components/parameters/instanceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  description: New "About" / status text (max ~139 chars)
      responses:
        '200':
          description: OK

  # ─── Messages ───────────────────────────────────────────────────────────────
  /instances/{instanceID}/messages/text:
    post:
      tags: [Messages]
      summary: Send or schedule a text message
      description: |
        If `send_at` is provided and in the future, the message is scheduled and
        returns `202 Accepted`. Otherwise it is sent immediately and returns `201 Created`.
      parameters:
        - $ref: '#/components/parameters/instanceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendTextRequest'
      responses:
        '201':
          description: Message sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '202':
          description: Message scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /instances/{instanceID}/messages/media:
    post:
      tags: [Messages]
      summary: Send or schedule a media message
      parameters:
        - $ref: '#/components/parameters/instanceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMediaRequest'
      responses:
        '201':
          description: Sent
        '202':
          description: Scheduled

  /instances/{instanceID}/messages/reaction:
    post:
      tags: [Messages]
      summary: Send a reaction to a message
      parameters:
        - $ref: '#/components/parameters/instanceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendReactionRequest'
      responses:
        '200':
          description: OK

  /instances/{instanceID}/messages/read:
    post:
      tags: [Messages]
      summary: Mark messages as read
      parameters:
        - $ref: '#/components/parameters/instanceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkReadRequest'
      responses:
        '200':
          description: OK

  /instances/{instanceID}/messages/batch:
    post:
      tags: [Messages]
      summary: Send up to 100 text messages in a single call
      parameters:
        - $ref: '#/components/parameters/instanceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchTextRequest'
      responses:
        '207':
          description: Multi-status — one result per message in request order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BatchResultItem'

  /instances/{instanceID}/messages/location:
    post:
      tags: [Messages]
      summary: Send a location pin
      parameters:
        - $ref: '#/components/parameters/instanceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendLocationRequest'
      responses:
        '201':
          description: Sent

  /instances/{instanceID}/messages/poll:
    post:
      tags: [Messages]
      summary: Send an interactive poll
      parameters:
        - $ref: '#/components/parameters/instanceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendPollRequest'
      responses:
        '201':
          description: Sent

  /instances/{instanceID}/messages/contact:
    post:
      tags: [Messages]
      summary: Send one or more contact vCards
      parameters:
        - $ref: '#/components/parameters/instanceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendContactRequest'
      responses:
        '201':
          description: Sent

  /instances/{instanceID}/messages/edit:
    post:
      tags: [Messages]
      summary: Edit a previously sent message
      parameters:
        - $ref: '#/components/parameters/instanceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditMessageRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /instances/{instanceID}/messages/disappearing:
    post:
      tags: [Messages]
      summary: Set the disappearing message timer for a chat
      parameters:
        - $ref: '#/components/parameters/instanceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDisappearingTimerRequest'
      responses:
        '200':
          description: OK

  /instances/{instanceID}/messages/status:
    post:
      tags: [Messages]
      summary: Post a WhatsApp Status (Story)
      description: |
        Posts a status update visible to all contacts. Supports text (with optional
        background color and font style), image, and video.
      parameters:
        - $ref: '#/components/parameters/instanceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendStatusRequest'
      responses:
        '201':
          description: Status posted

  /instances/{instanceID}/messages:
    get:
      tags: [Messages]
      summary: List messages for a chat
      parameters:
        - $ref: '#/components/parameters/instanceID'
        - name: chat
          in: query
          required: true
          schema:
            type: string
          description: Chat JID (e.g. 5511999999999@s.whatsapp.net)
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'

  /instances/{instanceID}/messages/scheduled:
    get:
      tags: [Messages]
      summary: List scheduled and cancelled messages for an instance
      parameters:
        - $ref: '#/components/parameters/instanceID'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: OK

  /instances/{instanceID}/messages/{msgID}:
    delete:
      tags: [Messages]
      summary: Revoke (delete for everyone) a sent message
      parameters:
        - $ref: '#/components/parameters/instanceID'
        - $ref: '#/components/parameters/msgID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: string
                  description: Chat JID where the message lives
      responses:
        '204':
          description: Revoked

  /instances/{instanceID}/messages/{msgID}/schedule:
    delete:
      tags: [Messages]
      summary: Cancel a scheduled message
      parameters:
        - $ref: '#/components/parameters/instanceID'
        - $ref: '#/components/parameters/msgID'
      responses:
        '204':
          description: Cancelled

  # ─── Contacts ───────────────────────────────────────────────────────────────
  /instances/{instanceID}/contacts:
    get:
      tags: [Contacts]
      summary: List locally cached contacts for an instance
      parameters:
        - $ref: '#/components/parameters/instanceID'
      responses:
        '200':
          description: OK

  /instances/{instanceID}/contacts/check:
    post:
      tags: [Contacts]
      summary: Check which phone numbers have a WhatsApp account
      parameters:
        - $ref: '#/components/parameters/instanceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phones]
              properties:
                phones:
                  type: array
                  items:
                    type: string
                  description: List of phone numbers (e.g. ["5511999990001"])
      responses:
        '200':
          description: OK

  /instances/{instanceID}/contacts/blocklist:
    get:
      tags: [Contacts]
      summary: Get the list of blocked contacts
      parameters:
        - $ref: '#/components/parameters/instanceID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  jids:
                    type: array
                    items:
                      type: string

  /instances/{instanceID}/contacts/{jid}:
    get:
      tags: [Contacts]
      summary: Get profile info for a contact
      parameters:
        - $ref: '#/components/parameters/instanceID'
        - $ref: '#/components/parameters/jid'
      responses:
        '200':
          description: OK

  /instances/{instanceID}/contacts/{jid}/picture:
    get:
      tags: [Contacts]
      summary: Get the profile picture URL for a contact or group
      parameters:
        - $ref: '#/components/parameters/instanceID'
        - $ref: '#/components/parameters/jid'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri

  /instances/{instanceID}/contacts/{jid}/block:
    post:
      tags: [Contacts]
      summary: Block a contact
      parameters:
        - $ref: '#/components/parameters/instanceID'
        - $ref: '#/components/parameters/jid'
      responses:
        '200':
          description: OK
    delete:
      tags: [Contacts]
      summary: Unblock a contact
      parameters:
        - $ref: '#/components/parameters/instanceID'
        - $ref: '#/components/parameters/jid'
      responses:
        '200':
          description: OK

  # ─── Groups ─────────────────────────────────────────────────────────────────
  /instances/{instanceID}/groups:
    get:
      tags: [Groups]
      summary: List groups the instance is a member of
      parameters:
        - $ref: '#/components/parameters/instanceID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupInfo'
    post:
      tags: [Groups]
      summary: Create a new group
      parameters:
        - $ref: '#/components/parameters/instanceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                participants:
                  type: array
                  items:
                    type: string
                  description: Phone numbers or JIDs of initial participants
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupInfo'

  /instances/{instanceID}/groups/join:
    post:
      tags: [Groups]
      summary: Join a group via invite link
      parameters:
        - $ref: '#/components/parameters/instanceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [link]
              properties:
                link:
                  type: string
                  description: Full invite URL (https://chat.whatsapp.com/CODE) or bare code
      responses:
        '200':
          description: Joined
          content:
            application/json:
              schema:
                type: object
                properties:
                  group_jid:
                    type: string

  /instances/{instanceID}/groups/{groupID}:
    get:
      tags: [Groups]
      summary: Get group metadata and participant list
      parameters:
        - $ref: '#/components/parameters/instanceID'
        - $ref: '#/components/parameters/groupID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupInfo'
    patch:
      tags: [Groups]
      summary: Update group name and/or description
      description: Send only the fields you want to change.
      parameters:
        - $ref: '#/components/parameters/instanceID'
        - $ref: '#/components/parameters/groupID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: OK

  /instances/{instanceID}/groups/{groupID}/participants:
    post:
      tags: [Groups]
      summary: Add, remove, promote, or demote participants
      parameters:
        - $ref: '#/components/parameters/instanceID'
        - $ref: '#/components/parameters/groupID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, participants]
              properties:
                action:
                  type: string
                  enum: [add, remove, promote, demote]
                participants:
                  type: array
                  items:
                    type: string
                  description: Phone numbers or JIDs
      responses:
        '200':
          description: OK

  /instances/{instanceID}/groups/{groupID}/leave:
    delete:
      tags: [Groups]
      summary: Leave a group
      parameters:
        - $ref: '#/components/parameters/instanceID'
        - $ref: '#/components/parameters/groupID'
      responses:
        '204':
          description: Left the group

  /instances/{instanceID}/groups/{groupID}/invite-link:
    get:
      tags: [Groups]
      summary: Get (or reset) the group invite link
      parameters:
        - $ref: '#/components/parameters/instanceID'
        - $ref: '#/components/parameters/groupID'
        - name: reset
          in: query
          schema:
            type: boolean
          description: Pass `true` to revoke the current link and generate a new one
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  link:
                    type: string
                    format: uri

  /instances/{instanceID}/groups/{groupID}/photo:
    put:
      tags: [Groups]
      summary: Set the group profile picture
      parameters:
        - $ref: '#/components/parameters/instanceID'
        - $ref: '#/components/parameters/groupID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: string
                  format: byte
                  description: Base64-encoded image bytes
      responses:
        '200':
          description: OK

  # ─── Webhooks ───────────────────────────────────────────────────────────────
  /webhooks:
    get:
      tags: [Webhooks]
      summary: List webhooks for your workspace
      responses:
        '200':
          description: OK
    post:
      tags: [Webhooks]
      summary: Register a new webhook endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
      responses:
        '201':
          description: Created

  /webhooks/{webhookID}:
    delete:
      tags: [Webhooks]
      summary: Delete a webhook
      parameters:
        - name: webhookID
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted

  # ─── Events ─────────────────────────────────────────────────────────────────
  /ws:
    get:
      tags: [Events]
      summary: Real-time event stream via WebSocket
      description: |
        Upgrade this request to a WebSocket connection to receive real-time engine events
        (message received, QR code, connection state changes, etc.) as JSON messages.

        **Authentication**: Pass your JWT as the `token` query parameter — WebSocket
        handshakes do not support `Authorization` headers in browsers.

        `ws://host/v1/ws?token=<jwt>`
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Valid JWT obtained from POST /auth/login
      responses:
        '101':
          description: Switching Protocols (WebSocket upgrade)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    instanceID:
      name: instanceID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    msgID:
      name: msgID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    keyID:
      name: keyID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    groupID:
      name: groupID
      in: path
      required: true
      schema:
        type: string
      description: Group JID (e.g. 120363000000000001@g.us) or numeric ID
    jid:
      name: jid
      in: path
      required: true
      schema:
        type: string
      description: WhatsApp JID (e.g. 5511999999999@s.whatsapp.net)
    limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        maximum: 100
    offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0

  schemas:
    RegisterRequest:
      type: object
      required: [email, password, name, terms_accepted]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
        terms_accepted:
          type: boolean
          description: Must be true to accept the GPLv3 license terms

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        workspace_id:
          type: string
        email:
          type: string

    Instance:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
        name:
          type: string
        phone_number:
          type: string
        status:
          type: string
          enum: [disconnected, connecting, connected, logged_out, banned]
        created_at:
          type: string
          format: date-time

    CreateInstanceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    InstanceSettings:
      type: object
      properties:
        reject_call:
          type: boolean
        read_messages:
          type: boolean
        always_online:
          type: boolean
        ignore_groups:
          type: boolean
        sync_full_history:
          type: boolean
        webhook_url:
          type: string
          format: uri
        webhook_events:
          type: array
          items:
            type: string

    SendTextRequest:
      type: object
      required: [to, text]
      properties:
        to:
          type: string
          description: Phone number (e.g. 5511999999999) or full JID
        text:
          type: string
        quoted_id:
          type: string
          description: WhatsApp message ID to quote/reply to
        send_at:
          type: string
          format: date-time
          description: Future timestamp to schedule delivery (RFC3339)

    SendMediaRequest:
      type: object
      required: [to, type, data, mime_type]
      properties:
        to:
          type: string
        type:
          type: string
          enum: [image, video, audio, document, sticker]
        data:
          type: string
          format: byte
          description: Base64-encoded file bytes
        mime_type:
          type: string
        file_name:
          type: string
        caption:
          type: string
        send_at:
          type: string
          format: date-time

    SendReactionRequest:
      type: object
      required: [to, message_id]
      properties:
        to:
          type: string
        message_id:
          type: string
        reaction:
          type: string
          description: Emoji character, or empty string to remove the reaction

    MarkReadRequest:
      type: object
      required: [chat, message_ids]
      properties:
        chat:
          type: string
        message_ids:
          type: array
          items:
            type: string

    BatchTextRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          maxItems: 100
          items:
            type: object
            required: [to, text]
            properties:
              to:
                type: string
              text:
                type: string
              send_at:
                type: string
                format: date-time

    BatchResultItem:
      type: object
      properties:
        index:
          type: integer
        message:
          $ref: '#/components/schemas/Message'
        error:
          type: string

    SendLocationRequest:
      type: object
      required: [to, lat, lng]
      properties:
        to:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        name:
          type: string
        address:
          type: string

    SendPollRequest:
      type: object
      required: [to, question, options]
      properties:
        to:
          type: string
        question:
          type: string
        options:
          type: array
          minItems: 2
          maxItems: 12
          items:
            type: string
        multi_select:
          type: boolean
          default: false

    SendContactRequest:
      type: object
      required: [to, contacts]
      properties:
        to:
          type: string
        contacts:
          type: array
          items:
            type: object
            required: [name, phone]
            properties:
              name:
                type: string
              phone:
                type: string

    EditMessageRequest:
      type: object
      required: [to, message_id, text]
      properties:
        to:
          type: string
          description: Chat JID where the original message was sent
        message_id:
          type: string
          description: WhatsApp message ID of the message to edit
        text:
          type: string
          description: New text content

    SetDisappearingTimerRequest:
      type: object
      required: [chat, seconds]
      properties:
        chat:
          type: string
          description: JID of the chat (user or group)
        seconds:
          type: integer
          description: |
            Timer duration in seconds.
            - `0` — off
            - `86400` — 24 hours
            - `604800` — 7 days
            - `7776000` — 90 days

    SendStatusRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [text, image, video]
        caption:
          type: string
          description: Text content (for type=text) or caption (for image/video)
        background_color:
          type: string
          description: Hex color for text status background (e.g. "#000000")
        font_type:
          type: integer
          description: |
            Font style for text status:
            - `0` — SansSerif (default)
            - `1` — Serif
            - `2` — Norican
            - `3` — Bryndan Write
            - `4` — Bebas Neue
            - `5` — Oswald
        data:
          type: string
          format: byte
          description: Base64-encoded image or video bytes (required for image/video)
        mime_type:
          type: string
          description: MIME type (required for image/video, e.g. image/jpeg, video/mp4)

    GroupInfo:
      type: object
      properties:
        jid:
          type: string
        name:
          type: string
        topic:
          type: string
          description: Group description
        participants:
          type: array
          items:
            $ref: '#/components/schemas/GroupParticipant'
        is_announce:
          type: boolean
          description: Only admins can send messages
        is_locked:
          type: boolean
          description: Only admins can edit group info
        created_at:
          type: string
          format: date-time

    GroupParticipant:
      type: object
      properties:
        jid:
          type: string
        admin:
          type: boolean

    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        instance_id:
          type: string
        whatsapp_message_id:
          type: string
        direction:
          type: string
          enum: [inbound, outbound]
        status:
          type: string
          enum: [pending, scheduled, queued, sent, delivered, read, failed, revoked, cancelled]
        from_jid:
          type: string
        to_jid:
          type: string
        chat_jid:
          type: string
        is_group:
          type: boolean
        type:
          type: string
          enum: [text, image, video, audio, document, sticker, reaction, location, poll, contact]
        content:
          type: object
        scheduled_at:
          type: string
          format: date-time
        sent_at:
          type: string
          format: date-time
        delivered_at:
          type: string
          format: date-time
        read_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    CreateWebhookRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
          description: Event types to receive; empty = all events
