run:
  timeout: 5m
  go: "1.22"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - revive
    - misspell
    - noctx
    - godot

linters-settings:
  goimports:
    local-prefixes: whatsapi
  revive:
    rules:
      - name: exported
        severity: warning
      - name: error-return
        severity: warning

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - wrapcheck
  max-issues-per-linter: 0
  max-same-issues: 0
